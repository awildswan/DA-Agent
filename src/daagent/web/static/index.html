<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据分析 Agent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <!-- 左栏：导航 -->
    <aside class="nav">
      <div class="brand">📊 数据分析 Agent</div>
      <div class="nav-section">
        <div class="nav-title">会话</div>
        <ul id="session-list" class="nav-list"></ul>
      </div>
      <div class="nav-section">
        <div class="nav-title">已连接工具</div>
        <ul class="nav-list tools">
          <li>📁 文件系统</li>
          <li>⌨️ 终端</li>
          <li>🌐 浏览器</li>
          <li>🔌 MCP 插件</li>
        </ul>
      </div>
    </aside>

    <!-- 中栏：对话核心 -->
    <main class="chat">
      <div id="messages" class="messages"></div>
      <div class="input-bar">
        <select id="model-select" class="model-select">
          <option value="deepseek-flash">deepseek-flash（快）</option>
          <option value="deepseek-v4-pro">deepseek-v4-pro（强）</option>
        </select>
        <input id="input" class="input" placeholder="问数据问题，回车发送…">
        <button id="send" class="send">发送</button>
      </div>
    </main>

    <!-- 右栏：产物面板 -->
    <aside class="panel">
      <div class="panel-section">
        <div class="panel-title">⚡ 消耗</div>
        <div id="token-usage" class="panel-body">—</div>
      </div>
      <div class="panel-section">
        <div class="panel-title">⏱ 任务进度</div>
        <div id="progress" class="panel-body">空闲</div>
      </div>
      <div class="panel-section grow">
        <div class="panel-title">📦 产物</div>
        <div id="artifacts" class="panel-body">文件预览 / 终端 / 浏览器输出（V0.9b）</div>
      </div>
    </aside>
  </div>
  <script src="app.js"></script>
</body>
</html>
