<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据分析 Agent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <!-- 左栏：导航 -->
    <aside class="nav">
      <div class="brand">📊 数据分析 Agent</div>
      <button id="new-session" class="new-session">＋ 新会话</button>
      <div class="nav-section">
        <div class="nav-title">会话</div>
        <ul id="session-list" class="nav-list"></ul>
      </div>
      <div class="nav-section">
        <div class="nav-title">已连接工具</div>
        <ul id="tool-list" class="nav-list tools"></ul>
      </div>
    </aside>

    <!-- 中栏：对话核心 -->
    <main class="chat">
      <div id="messages" class="messages"></div>
      <div class="input-bar">
        <input id="input" class="input" placeholder="问数据问题，回车发送…">
        <button id="send" class="send">发送</button>
      </div>
      <div class="controls-bar">
        <label class="ctrl">模型
          <select id="model-select">
            <option value="deepseek-flash">flash（快）</option>
            <option value="deepseek-v4-pro">v4-pro（强）</option>
          </select>
        </label>
        <label class="ctrl"><input type="checkbox" id="deep-thinking"> 🧠 深度思考</label>
      </div>
    </main>

    <!-- 右栏：产物面板 -->
    <aside class="panel">
      <div class="panel-section">
        <div class="panel-title">⚡ 消耗</div>
        <div id="token-usage" class="panel-body">—</div>
      </div>
      <div class="panel-section">
        <div class="panel-title">⏱ 任务进度</div>
        <div id="progress" class="panel-body">空闲</div>
      </div>
      <div class="panel-section grow">
        <div class="panel-title">📦 产物</div>
        <div id="artifacts" class="panel-body">文件预览 / 终端 / 浏览器输出（后续）</div>
      </div>
    </aside>
  </div>
  <script src="app.js"></script>
</body>
</html>
